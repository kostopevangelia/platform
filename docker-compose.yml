version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_DATABASE: payment_service
      MYSQL_ROOT_PASSWORD: "18sep2000*"
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p18sep2000* | grep 'mysqld is alive'"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
  
  fraud-detection:
    build:
      context: ./fraud-detection
      dockerfile: Dockerfile
    container_name: fraud-detection
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http:localhost:8080/docs')"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-system:
    build:
      context: ./payment-system
      dockerfile: Dockerfile
    container_name: payment-system
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
volumes:
  mysql_data:
