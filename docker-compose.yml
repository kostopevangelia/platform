services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-payment_service}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
    expose:
      - "3306"                # μόνο στο internal network
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD} | grep 'mysqld is alive'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  fraud-detection:
    build:
      context: ./fraud-detection
      dockerfile: Dockerfile
    environment:
      MODEL_DIR: ${MODEL_DIR:-/app/models}
    expose:
      - "8000"                # δεν κάνει publish στο host
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10m
      timeout: 5s
      retries: 5
    restart: unless-stopped

  payment-system:
    build:
      context: ./payment-system
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-payment_service}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      FRAUD_API_URL: http://fraud-detection:8000/predict-fraud
    ports:
      - "8080"                # τυχαία host port -> ΠΟΤΕ conflict
    depends_on:
      mysql:
        condition: service_healthy
      fraud-detection:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
